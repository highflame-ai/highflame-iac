send_traces:
  variations:
    enabled: true
  defaultRule:
    variation: enabled

profiler:
  variations:
    enabled: false
  defaultRule:
    variation: enabled

send_traces_as_events:
  variations:
    enabled: true
  defaultRule:
    variation: enabled

# red_team_scan and palisade are OFF because this stack does not run either
# backend — docker-compose.yaml has no highflame-redteam service, and palisade's
# workers live there too.
#
# These are not cosmetic. Admin reads both at startup (internal/admin/server/
# server.go) and only then sets up their databases and registers their modules,
# so `false` here means no connection pool, no CREATE TABLE, and no routes.
# While they were `true`, Admin opened javelin_redteam and highflame_guardian on
# every boot purely to satisfy config for products that were not present — which
# is why config/postgres/init/01-databases.sql has to create them.
#
# Those two databases are still created, deliberately. They cost nothing empty,
# and dropping them would make flipping these flags back a boot failure on any
# existing volume, since initdb only runs once.
red_team_scan:
  variations:
    disabled: false
  defaultRule:
    variation: disabled

guardian:
  variations:
    enabled: true
  defaultRule:
    variation: enabled

palisade:
  variations:
    disabled: false
  defaultRule:
    variation: disabled

internal_user:
  variations:
    enabled: true
    disabled: false
  targeting:
    - name: Javelin Internal User
      query: (flag_name in ["policy_template","file_attachment_policy","code_agents"])
      variation: enabled
  defaultRule:
    variation: disabled

whitelisted_hosts:
  variations:
    enabled: true
    disabled: false
  targeting:
    - name: Javelin Host name
      query: hostname in ["localhost"]
      variation: enabled
  defaultRule:
    variation: disabled

sandbox:
  variations:
    enabled: false
  defaultRule:
    variation: enabled

# Unified Control Fabric policy UI (highflame-studio#1476). Off means the legacy
# per-product policy screens. Studio ships it defaulted OFF, so it has to be
# turned on here rather than assumed -- an undefined flag resolves to the code
# default, not to `enabled`.
#
# Also read by registry/identities/[id], so it changes the identity detail page
# as well as the policy screens.
studio_control_fabric_ui:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled
