server:
  port: 8090
  read_timeout: 30s
  write_timeout: 60s
  shutdown_timeout: 15s
  cors_origins: []  # Empty = allow all origins (dev mode)

clickhouse:
  addr: "highflame-clickhouse:9000"
  database: "highflame"
  username: "default"
  password: ""
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 1h
  dial_timeout: 5s
  query_timeout: 10s
  debug: false

cache:
  enabled: true
  overview_ttl: 15s
  aggregation_ttl: 60s
  max_entries: 10000

auth:
  jwks_url: ""  # Env var HIGHFLAME_AUTH_JWKS_URL overrides (e.g., http://highflame-authn:8051/.well-known/jwks.json)
  jwt_public_key: ""  # Empty = dev mode (accept any bearer)

migrations:
  enabled: true
  path: "migrations"

logging:
  level: "info"
  format: "json"

# OTEL telemetry — exports traces + metrics to highflame-collector.
# sampling_rate 1.0 keeps every trace; revisit when query latency degrades.
telemetry:
  enabled: true
  endpoint: "highflame-collector:4317"
  insecure: true
  sampling_rate: 1.0

viewql:
  enabled: true
  debug: false
  max_rows: 10000
  # Studio's Overwatch dashboard renders event-listing tables that group by
  # event_id + a wide set of attribute columns (up to ~23 dims). Default
  # of 5 is too low for that use case; 25 covers realistic payloads with
  # headroom.
  max_dimensions: 25
  max_measures: 10
  query_timeout: 30s
  max_date_range_days: 365