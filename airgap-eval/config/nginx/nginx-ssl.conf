worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 15s;

    client_max_body_size 32m;

    log_format evalfmt '$remote_addr $host "$request" $status '
                       '$body_bytes_sent ${request_time}s -> $upstream_addr';

    access_log /dev/stdout evalfmt;
    error_log  /dev/stderr warn;

    upstream studio {
        server highflame-studio:3000;
        keepalive 16;
    }

    upstream keycloak {
        server highflame-keycloak:8080;
        keepalive 16;
    }

    upstream admin {
        server highflame-admin:8040;
        keepalive 16;
    }

    upstream observatory {
        server highflame-observatory:8090;
        keepalive 16;
    }

    upstream cerberus {
        server highflame-cerberus:8082;
        keepalive 16;
    }

    upstream firehog {
        server highflame-firehog:8080;
        keepalive 32;
    }

    upstream shield {
        server highflame-shield:8070;
        keepalive 32;
    }

    upstream authn {
        server highflame-authn:8051;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -------------------------------------------------------------------------
    # HTTP -> HTTPS
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # -------------------------------------------------------------------------
    # HTTPS
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privatekey.pem;

        # Reasonable TLS defaults for an air-gapped deployment.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # IMPORTANT:
        # This is now "https" because the client connection to nginx is HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # ---------------------------------------------------------------------
        # Identity
        # ---------------------------------------------------------------------
        location /auth/ {
            proxy_pass http://keycloak;
        }

        # AuthN, what the Highflame SDK talks to for identity. Three exact
        # routes on purpose: most of AuthN's admin API authenticates nothing by
        # itself and relies on not being reachable from outside, so a prefix
        # mount would publish an unauthenticated cross-tenant admin API. Only
        # /agents/register and /agents/registry/* accept a bearer token, which
        # is all an SDK caller holds. The tenant and internal-service headers
        # are cleared because AuthN sets them from validated claims itself.
        # AuthN's key set, so an SDK caller can verify a token this stack issued.
        # tokens.verify() derives this URL from the identity base URL, and without
        # the route it reaches Studio, whose own key set does not contain AuthN's
        # signing key. Studio serves this path too. Shield, Observatory and
        # Firehog fetch JWKS by container name, but AuthN itself loads its key
        # set from {issuer}/.well-known/jwks.json, and its issuer is this
        # origin, so this route must reach AuthN.
        location = /.well-known/jwks.json {
          proxy_pass http://authn;
        }

        # The receipt key set, for the same reason. Shield signs every guard
        # decision and AuthN publishes the verifying key here. Without the
        # route it reaches Studio, which has no such path, and the audit log
        # reports "Verification failed" on a signature that is actually good.
        location = /.well-known/highflame-receipt-keys {
          proxy_pass http://authn;
        }

        location = /oauth2/token {
          proxy_pass http://authn;
          proxy_set_header X-Account-ID               "";
          proxy_set_header X-Project-ID               "";
          proxy_set_header X-User-ID                  "";
          proxy_set_header X-Internal-Service         "";
          proxy_set_header X-Internal-Service-Secret  "";
        }

        # AuthN is the only OAuth authorization server, and its issuer is THIS
        # origin (HIGHFLAME_ISSUER in docker-compose.yaml). Its discovery document
        # therefore names endpoints here, and browsers, CLIs and MCP clients open
        # them here. Each route is exact, like the ones above: the AS surface a
        # public client needs and nothing more. Not routed, deliberately:
        # /oauth2/register (machine-client registration), /oauth2/bc-authorize,
        # /oauth2/token/introspect and /oauth2/token/revoke, which the discovery
        # document also lists; here they reach Studio and 404.

        location = /.well-known/oauth-authorization-server {
          proxy_pass http://authn;
        }

        location = /.well-known/openid-configuration {
          proxy_pass http://authn;
        }

        # Browser entry. AuthN sends the browser on to Studio's /cli-auth page
        # on this same origin; Studio's approve step POSTs the signed assertion
        # to AuthN over the internal network, so only GET is needed here.

        location = /oauth2/authorize {
          limit_except GET { deny all; }
          proxy_pass http://authn;
          # A proxy_set_header here replaces the server-level set rather than
          # adding to it, so the forwarding headers are restated. AuthN rate-limits
          # client registration by the last X-Forwarded-For entry, which is the
          # address nginx saw; without it every caller would share one bucket.
          proxy_set_header Host                       $host;
          proxy_set_header X-Real-IP                  $remote_addr;
          proxy_set_header X-Forwarded-For            $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto          $scheme;
          proxy_set_header X-Forwarded-Host           $host;
          proxy_set_header X-Account-ID               "";
          proxy_set_header X-Project-ID               "";
          proxy_set_header X-User-ID                  "";
          proxy_set_header X-Internal-Service         "";
          proxy_set_header X-Internal-Service-Secret  "";
        }

        # RFC 8628 device login (start, then poll), and RFC 7591 registration
        # for public PKCE clients such as MCP clients.

        location = /oauth2/device_authorization {
          proxy_pass http://authn;
          # A proxy_set_header here replaces the server-level set rather than
          # adding to it, so the forwarding headers are restated. AuthN rate-limits
          # client registration by the last X-Forwarded-For entry, which is the
          # address nginx saw; without it every caller would share one bucket.
          proxy_set_header Host                       $host;
          proxy_set_header X-Real-IP                  $remote_addr;
          proxy_set_header X-Forwarded-For            $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto          $scheme;
          proxy_set_header X-Forwarded-Host           $host;
          proxy_set_header X-Account-ID               "";
          proxy_set_header X-Project-ID               "";
          proxy_set_header X-User-ID                  "";
          proxy_set_header X-Internal-Service         "";
          proxy_set_header X-Internal-Service-Secret  "";
        }

        location = /oauth2/device/token {
          proxy_pass http://authn;
          # A proxy_set_header here replaces the server-level set rather than
          # adding to it, so the forwarding headers are restated. AuthN rate-limits
          # client registration by the last X-Forwarded-For entry, which is the
          # address nginx saw; without it every caller would share one bucket.
          proxy_set_header Host                       $host;
          proxy_set_header X-Real-IP                  $remote_addr;
          proxy_set_header X-Forwarded-For            $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto          $scheme;
          proxy_set_header X-Forwarded-Host           $host;
          proxy_set_header X-Account-ID               "";
          proxy_set_header X-Project-ID               "";
          proxy_set_header X-User-ID                  "";
          proxy_set_header X-Internal-Service         "";
          proxy_set_header X-Internal-Service-Secret  "";
        }

        location = /oauth2/public/register {
          proxy_pass http://authn;
          # A proxy_set_header here replaces the server-level set rather than
          # adding to it, so the forwarding headers are restated. AuthN rate-limits
          # client registration by the last X-Forwarded-For entry, which is the
          # address nginx saw; without it every caller would share one bucket.
          proxy_set_header Host                       $host;
          proxy_set_header X-Real-IP                  $remote_addr;
          proxy_set_header X-Forwarded-For            $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto          $scheme;
          proxy_set_header X-Forwarded-Host           $host;
          proxy_set_header X-Account-ID               "";
          proxy_set_header X-Project-ID               "";
          proxy_set_header X-User-ID                  "";
          proxy_set_header X-Internal-Service         "";
          proxy_set_header X-Internal-Service-Secret  "";
        }

        location = /agents/register {
          proxy_pass http://authn;
          proxy_set_header X-Account-ID               "";
          proxy_set_header X-Project-ID               "";
          proxy_set_header X-User-ID                  "";
          proxy_set_header X-Internal-Service         "";
          proxy_set_header X-Internal-Service-Secret  "";
        }

        location /agents/registry {
          proxy_pass http://authn;
          proxy_set_header X-Account-ID               "";
          proxy_set_header X-Project-ID               "";
          proxy_set_header X-User-ID                  "";
          proxy_set_header X-Internal-Service         "";
          proxy_set_header X-Internal-Service-Secret  "";
        }

        # ---------------------------------------------------------------------
        # Control plane
        # ---------------------------------------------------------------------
        location /v1/admin/ {
            proxy_pass http://admin;
        }

        location /v2/admin/ {
            proxy_pass http://admin;
        }

        location /obs-api/ {
            proxy_pass http://observatory/;
        }

        location /v1/cerberus/ {
            proxy_pass http://cerberus;
        }

        location /v1/shield/ {
            proxy_pass http://shield;
        }

        # ---------------------------------------------------------------------
        # Data plane
        # ---------------------------------------------------------------------
        location /gateway/ {
            proxy_pass http://firehog/;
            proxy_buffering off;
        }

        # ---------------------------------------------------------------------
        # Health
        # ---------------------------------------------------------------------
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # ---------------------------------------------------------------------
        # Highflame operator surfaces
        # ---------------------------------------------------------------------
        location ~ ^/(api/)?internal(/|$) {
            access_log off;
            return 404;
        }

        # ---------------------------------------------------------------------
        # UI
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://studio;

            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
        }
    }
}