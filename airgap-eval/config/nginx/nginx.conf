# Single ingress for the air-gapped evaluation stack.
#
# Everything is served from ONE origin. That is a correctness requirement, not
# tidiness: Keycloak stamps the `iss` claim with the host the request arrived on
# and Admin pins the issuer, so the browser and the containers must reach the
# login service by the same URL. One origin makes that automatic.
#
# This is also the only container besides firehog with a route off the box, so
# it is the entire attack surface presented to your network.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # Agent traffic through the gateway can be long-lived (streaming completions),
  # so the proxy must not cut it short at the default 60s.
  proxy_read_timeout    600s;
  proxy_send_timeout    600s;
  proxy_connect_timeout 15s;

  client_max_body_size 32m;

  log_format  evalfmt  '$remote_addr $host "$request" $status '
                       '$body_bytes_sent ${request_time}s -> $upstream_addr';
  access_log  /dev/stdout evalfmt;
  error_log   /dev/stderr warn;

  # Named upstreams resolved at startup. If one is down nginx refuses to start,
  # which is preferable to a stack that boots and 502s in unpredictable places.
  upstream studio       { server highflame-studio:3000;      keepalive 16; }
  upstream keycloak     { server highflame-keycloak:8080;     keepalive 16; }
  upstream admin        { server highflame-admin:8040;        keepalive 16; }
  upstream observatory  { server highflame-observatory:8090;  keepalive 16; }
  upstream cerberus     { server highflame-cerberus:8082;     keepalive 16; }
  upstream firehog      { server highflame-firehog:8080;      keepalive 32; }
  upstream shield       { server highflame-shield:8070;      keepalive 32; }

  # Header set every upstream needs. Keycloak in particular depends on
  # X-Forwarded-* (KC_PROXY_HEADERS=xforwarded) to build correct issuer and
  # redirect URLs; without them it would advertise its container hostname and
  # break the login redirect.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # ---- Identity -----------------------------------------------------------
    # Keycloak runs with KC_HTTP_RELATIVE_PATH=/auth, so the prefix is passed
    # through unchanged rather than stripped. The OIDC issuer is therefore
    # http://<host>/auth/realms/highflame — the value Admin pins and Studio uses.
    location /auth/ {
      proxy_pass http://keycloak;
    }

    # ---- Control plane ------------------------------------------------------
    # Studio's browser-side code calls Admin through these paths
    # (NEXT_PUBLIC_ADMIN_API_URL), so it stays same-origin and needs no CORS.
    #
    # The services' OWN paths, unrewritten — the same convention local-deploy
    # and the k8s ingresses use (`path: /v1/admin`, `path: /v2/admin`,
    # `path: /v1/obs`, all pathType Prefix). This used to be `/api/admin/` with
    # a trailing slash on proxy_pass, which strips the prefix, so every caller
    # had to write the doubled `/api/admin/v1/admin/...`. Nothing was gained for
    # it, and a URL that works here now works against dev1 by swapping the host.
    #
    # No trailing slash on proxy_pass: that is what preserves the path. Adding
    # one silently strips the location prefix and every route 404s.
    #
    # Admin and Observatory can share a host this way because their paths do not
    # overlap. Firehog cannot — its ingress path is `/`, which would swallow
    # Studio — so it keeps a prefix below.
    location /v1/admin/ {
      proxy_pass http://admin;
    }

    location /v2/admin/ {
      proxy_pass http://admin;
    }

    # Raw Observatory API for PROGRAMMATIC callers (the notebook), which bring
    # their own Highflame RS256 token. The prefix is stripped so the notebook's
    # URL stays stable; Observatory's whole surface is under /v1/obs, including
    # its docs and schema, so it collides with nothing in Studio. Worth moving to
    # an unstripped `location /v1/obs/` later, which is what this file argues for
    # above and would drop the doubled /obs-api/v1/obs/ in caller URLs.
    #
    # This deliberately does NOT sit on /api/observatory/. That path is a Next.js
    # route inside Studio, and that route is what exchanges the browser's OIDC
    # session for an RS256 token. Serving it here handed the raw IdP token
    # straight to Observatory, which rejected it, so every Studio telemetry call
    # answered 401. It must fall through to `location /`.
    location /obs-api/ {
      proxy_pass http://observatory/;
    }

    location /v1/cerberus/ {
      proxy_pass http://cerberus;
    }

    location /v1/shield/ {
      proxy_pass http://shield;
    }

    # ---- Data plane ---------------------------------------------------------
    # Point your agent's OpenAI-compatible base URL at http://<host>/gateway/v1.
    # Every request through here is inspected by Shield before it reaches your
    # LLM, which is the thing the evaluation is actually demonstrating.
    location /gateway/ {
      proxy_pass http://firehog/;
      # Streaming responses must not be buffered, or token-by-token output
      # arrives in one lump and the demo looks broken.
      proxy_buffering off;
    }

    # ---- Health -------------------------------------------------------------
    # Unauthenticated, so you can check the stack is alive before logging in.
    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # ---- Highflame-operator surfaces: not reachable here --------------------
    # Studio's internal support tooling is for Highflame staff, gated on an
    # @highflame.com email claim. Studio already refuses these routes outright on
    # an OIDC build, and that refusal is the real control — but it is a RUNTIME
    # check, and this is a second, independent one at the ingress.
    #
    # Worth having both: the email gate cannot be trusted here on its own, because
    # on this deployment YOU own the identity provider and could mint a user with
    # any address, including an allow-listed one. Blocking at the edge means the
    # routes are unreachable regardless of what any token claims.
    #
    # 404 rather than 403, matching Studio: from outside, indistinguishable from a
    # path that was never deployed.
    location ~ ^/(api/)?internal(/|$) {
      access_log off;
      return 404;
    }

    # ---- UI -----------------------------------------------------------------
    location / {
      proxy_pass http://studio;

      # Auth.js writes its session as a signed, encrypted JWT in a cookie, and
      # that JWT carries the IdP's id_token. Over ~4KB it is split across
      # authjs.session-token.0, .1, .2 ... — several large Set-Cookie headers in
      # one response. nginx's default 4k/8k proxy buffer cannot hold that header
      # block and answers 502 "upstream sent too big header" instead.
      #
      # This bites exactly once, on the OIDC callback that establishes the
      # session, so sign-in fails while every other page works — which reads
      # like a broken login rather than a proxy limit. Observed on this stack.
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
      proxy_busy_buffers_size 32k;
    }
  }
}
