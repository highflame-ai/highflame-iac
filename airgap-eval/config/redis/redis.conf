# Redis configuration file

# By default, Redis listens for connections from all the network interfaces
# on the server. To listen only on the localhost, uncomment the following line.
# bind 127.0.0.1

# Specify the Redis port. The default port is 6379.
port 6379

# By default, Redis does not require a password, but you can require clients
# to authenticate with a password. To set a password, uncomment and update the
# following line.
# requirepass yourpassword

# save ""
# This directive configures Redis to perform snapshotting, which is how Redis provides data persistence. By setting it to an empty string, automatic snapshotting is disabled.
# Disabling snapshotting means Redis will not save the dataset to disk periodically. If Redis restarts, any data held in memory will be lost. This setting is typically used when persistence is not required, such as in caching scenarios.
save ""

# appendonly no
# This directive controls the Append Only File (AOF) persistence mode. Setting 'appendonly' to 'no' disables the AOF persistence, meaning Redis will not log every write operation to a file.
# Disabling AOF can improve write performance but, like disabling snapshots, means that data will be lost on restart. Use this setting when data persistence is not a concern.
appendonly no

# stop-writes-on-bgsave-error no
# This directive tells Redis whether it should stop accepting writes if a background save (snapshotting) operation fails. Setting this to 'no' means Redis will continue to accept writes even if a background save fails.
# This setting is relevant if snapshotting is enabled (which is not the case here). In scenarios where you've disabled snapshotting, this setting has no effect.
# stop-writes-on-bgsave-error no

# Set the maximum memory to use. If you want to specify the max memory, uncomment
# and update the following line. Example: 100mb
# maxmemory 100mb

# Log level and file
# loglevel notice
# logfile "/var/log/redis/redis-server.log"

# Specify the number of databases. The default database is DB 0, you can select
# a different one on a per-connection basis using SELECT <dbid> where dbid is a
# number between 0 and 'databases'-1
databases 16

# maxmemory 100mb
# This directive sets the maximum amount of memory that Redis should use. Once this limit is reached, Redis will start evicting data based on the specified 'maxmemory-policy'.
# Setting this to '200mb' limits Redis to use only 200 megabytes of memory.
# maxmemory 200mb

# maxmemory-policy allkeys-lru
# This directive sets the policy for key eviction when the maxmemory limit is reached. 'allkeys-lru' means Redis will evict keys by trying to remove the least recently used (LRU) keys first, regardless of whether or not they have an expiry set.
# This policy is useful when Redis is used as a cache and you want to remove older, less recently accessed data first.
maxmemory-policy allkeys-lru

# tcp-backlog 128
# This directive sets the TCP backlog size, which is the number of connections that can be waiting while the process is handling a particular connection. This setting can help improve Redis performance under high loads.
# A value of 128 is often sufficient for most scenarios, but this might need to be increased in high-throughput environments.
tcp-backlog 128

# latency-monitor-threshold 100
# This directive enables latency monitoring in Redis. If any command execution latency is greater than the specified threshold (in milliseconds), it will be logged.
# Setting this to '100' will log any command that takes longer than 100 milliseconds to execute. This can be useful for identifying and troubleshooting potential latency issues.
latency-monitor-threshold 100
